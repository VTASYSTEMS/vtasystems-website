<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết sản phẩm | VTA SYSTEMS</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>:root{--orange:#ff6a00;--orange2:#ff8a33;--ink:#17202a;--muted:#667085;--bg:#f7f9fc;--card:#fff;--line:#e7ebf0;--shadow:0 12px 35px rgba(23,32,42,.08)}*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.container{max-width:1200px;margin:auto;padding:0 24px}header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-size:24px;font-weight:900}.logo i{color:var(--orange);font-style:normal}.navlinks{display:flex;gap:20px;flex-wrap:wrap}.navlinks a{font-weight:700;color:#475467}.navlinks a:hover{color:var(--orange)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;background:var(--orange);color:#fff;font-weight:800;cursor:pointer}.btn:hover{background:var(--orange2)}.btn.secondary{background:#eef1f5;color:var(--ink)}.btn.danger{background:#e53935}.hero{padding:80px 0;background:linear-gradient(135deg,#fff,#fff7ef)}.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center}.eyebrow{color:var(--orange);font-weight:900}.hero h1{font-size:clamp(42px,6vw,70px);line-height:1.02;margin:15px 0}.hero p{font-size:18px;color:var(--muted);margin-bottom:25px}.hero-art{height:360px;border-radius:28px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;place-items:center}.section,.page{padding:65px 0}.section-head,.page-title{text-align:center;margin-bottom:35px}.section-head h2,.page-title h1{font-size:40px}.section-head p,.page-title p{color:var(--muted);margin-top:8px}.products-grid,.series-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.product-card,.series-card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.product-card{overflow:hidden;display:flex;flex-direction:column}.product-image{height:270px;display:grid;place-items:center;padding:15px}.product-image img{width:100%;height:100%;object-fit:contain}.product-body{padding:20px;display:flex;flex-direction:column;flex:1}.product-body h3{font-size:21px;margin:6px 0}.category{color:var(--orange);font-weight:800;font-size:13px}.specs{list-style:none;min-height:145px;display:flex;flex-direction:column;gap:7px}.specs li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#56616e;font-size:14px}.specs i{color:var(--orange);width:22px;text-align:center}.specs strong{color:#26313d}.card-actions{display:flex;gap:9px;margin-top:18px}.card-actions>*{flex:1}.loading,.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted)}.spinner{width:34px;height:34px;border:4px solid #eee;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.contact{background:#17202a;color:#fff}.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.contact-box{background:#202b37;padding:22px;border-radius:14px}.contact-box i{color:var(--orange);font-size:24px;margin-bottom:10px}footer{background:#111923;color:#9aa5b1;text-align:center;padding:25px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{border:1px solid #d9dee6;border-radius:10px;padding:12px;background:#fff}.panel{padding:25px}.notice{margin-top:15px;padding:12px;border-radius:10px;background:#f3f5f7;white-space:pre-line}.notice.ok{background:#eaf8ef;color:#16713a}.notice.err{background:#fff0f0;color:#b42318}.detail{display:grid;grid-template-columns:1fr 1fr;gap:40px}.gallery{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.gallery-main{height:430px;display:grid;place-items:center}.gallery-main img{max-width:100%;max-height:100%;object-fit:contain}.thumbs{display:flex;gap:10px;overflow:auto;margin-top:15px}.thumbs img{width:76px;height:76px;object-fit:cover;border:2px solid transparent;border-radius:8px}.detail-price{font-size:32px;color:var(--orange);font-weight:900;margin:18px 0}.detail-desc{color:#56616e;white-space:pre-line;margin:20px 0}.detail-specs{list-style:none;display:grid;gap:10px}.detail-specs li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.video{margin-top:20px}.video video{width:100%;max-height:400px;background:#000;border-radius:14px}.series-card{text-align:center;padding:35px}.series-card i{font-size:45px;color:var(--orange);margin-bottom:15px}.series-card p{color:var(--muted);min-height:52px;margin:10px 0 20px}.cart-list,.admin-list{display:grid;gap:14px}.cart-item,.admin-row{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.cart-item{display:grid;grid-template-columns:100px 1fr auto;gap:18px;align-items:center}.cart-item img,.admin-row img{width:100px;height:85px;object-fit:contain}.summary{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;justify-content:space-between;align-items:center}.admin-row{display:grid;grid-template-columns:80px 1fr auto;gap:15px;align-items:center}.admin-row img{width:80px;height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:linear-gradient(135deg,#fff,#fff5eb)}.auth{width:min(440px,100%);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:32px}.auth h1{text-align:center}.sub{text-align:center;color:var(--muted);margin:8px 0 25px}@media(max-width:900px){.hero-grid,.detail{grid-template-columns:1fr}.products-grid,.series-grid,.contact-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.products-grid,.series-grid,.contact-grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.cart-item{grid-template-columns:70px 1fr}.admin-row{grid-template-columns:60px 1fr}.admin-row img{width:60px;height:60px}.hero-art{height:260px}.nav{align-items:flex-start;padding:14px 0}}</style></head><body><header><div class="container nav"><a class="logo" href="index.html">VTA <i>⚡</i> SYSTEMS</a><nav class="navlinks"><a href="index.html">Trang chủ</a><a href="series.html">Dòng loa</a><a href="orders.html">Đơn hàng</a><a href="cart.html">🛒 Giỏ hàng</a><a href="account.html">Tài khoản</a></nav></div></header><main class="page"><div class="container" id="a"><div class="loading"><div class="spinner"></div>Đang tải sản phẩm...</div></div></main><footer>© 2026 VTA SYSTEMS</footer><script type="module">import{database}from"./firebase.js";import{ref,get}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";let id=new URLSearchParams(location.search).get("id");if(!id)a.innerHTML='<div class="empty">Thiếu mã sản phẩm.</div>';else get(ref(database,"products/"+id)).then(s=>{if(!s.exists())return a.innerHTML='<div class="empty">Không tìm thấy sản phẩm.</div>';let p=s.val(),imgs=p.images||[p.image||""],im=imgs[0];a.innerHTML=`<div class="page-title"><h1>${p.name||""}</h1><p>${p.category||"VTA SYSTEMS"}</p></div><div class="detail"><section class="gallery"><div class="gallery-main"><img id="mi" src="${im}"></div><div class="thumbs">${imgs.map(x=>`<img src="${x}" onclick="mi.src='${x}'">`).join("")}</div></section><section><h1>${p.name||""}</h1><div class="detail-price">${Number(p.price||0).toLocaleString("vi-VN")}đ</div><p><b>Tồn kho:</b> ${p.stock??0}</p><p class="detail-desc">${p.description||"Chưa có mô tả."}</p><ul class="detail-specs">${Object.entries(p.specs||{}).filter(([,v])=>v).map(([k,v])=>`<li><strong>${k}:</strong> ${v}</li>`).join("")}</ul><div class="card-actions" style="margin-top:20px"><button class="btn" onclick="add()">🛒 Thêm vào giỏ</button><a class="btn secondary" href="index.html#contact">Liên hệ</a></div>${p.video?`<div class="video"><h3>Video sản phẩm</h3><video controls src="${p.video}"></video></div>`:""}</section></div>`;window.add=()=>{let c=JSON.parse(localStorage.getItem("cart")||"[]"),x=c.find(i=>i.id===id);x?x.qty++:c.push({id,name:p.name||"",price:Number(p.price)||0,image:im,qty:1});localStorage.setItem("cart",JSON.stringify(c));alert("Đã thêm vào giỏ hàng!")}})</script></body></html>
